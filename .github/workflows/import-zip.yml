name: Import Project ZIP

on:
  push:
    branches: ["**"]
    paths:
      - "*.zip"
      - "*.ZIP"
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        type: choice
        required: true
        options:
          - restore
          - clean-repo
      backup_tag:
        description: "For restore: tag name. Leave empty = newest backup"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: import-project-zip
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PRESERVE_FILES: ""
  MAX_ZIP_MB: "200"
  MAX_UNZIPPED_MB: "1000"
  MAX_FILES: "50000"
  MAX_FILE_MB: "100"
  BLOCK_SECRET_FILES: "true"
  MAX_REMOVED_PERCENT: "80"
  BACKUP_TAG: "true"
  BACKUP_KEEP: "3"
  TRIGGER_WORKFLOWS: ""
  PAT_AVAILABLE: ${{ secrets.GH_PAT != '' }}

jobs:
  import:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Detect ZIP
        id: find
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -iname '*.zip' | sort)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::notice::No ZIP file in repository root. Nothing to import."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::Only one ZIP file is allowed in the repository root."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "Found: ${ZIPS[0]}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail

          ZIP_BYTES="$(stat -c%s "$ZIP")"
          if [ "$ZIP_BYTES" -gt $((MAX_ZIP_MB * 1024 * 1024)) ]; then
            echo "::error::The ZIP is larger than ${MAX_ZIP_MB} MB."
            exit 1
          fi

          unzip -tq "$ZIP" >/dev/null
          LIST="$(mktemp)"
          unzip -Z1 "$ZIP" > "$LIST"

          if [ ! -s "$LIST" ]; then
            echo "::error::The ZIP is empty."
            exit 1
          fi

          if grep -qE '^/|^[A-Za-z]:|\\|(^|/)\.\.(\/|$)' "$LIST"; then
            echo "::error::Unsafe path found in ZIP."
            grep -nE '^/|^[A-Za-z]:|\\|(^|/)\.\.(\/|$)' "$LIST" | head -20
            exit 1
          fi

          STATS="$(unzip -Zt "$ZIP")"
          FILE_COUNT="$(printf '%s\n' "$STATS" | awk '{print $1}')"
          RAW_BYTES="$(printf '%s\n' "$STATS" | awk '{print $3}')"

          if [ "$FILE_COUNT" -gt "$MAX_FILES" ]; then
            echo "::error::The ZIP has $FILE_COUNT files. Limit: $MAX_FILES."
            exit 1
          fi
          if [ "$RAW_BYTES" -gt $((MAX_UNZIPPED_MB * 1024 * 1024)) ]; then
            echo "::error::The uncompressed ZIP is larger than ${MAX_UNZIPPED_MB} MB."
            exit 1
          fi

          if [ "$BLOCK_SECRET_FILES" = "true" ]; then
            SECRETS="$(grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|\.pem$|\.p12$|\.pfx$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' "$LIST" \
              | grep -viE '\.env\.(example|sample|template|dist)$' || true)"
            if [ -n "$SECRETS" ]; then
              echo "::error::The ZIP contains files that look like secrets."
              printf '%s\n' "$SECRETS" | head -20
              exit 1
            fi
          fi

          echo "ZIP is valid and safe. Files: $FILE_COUNT"

      - name: Stage ZIP and importer workflow
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/zip-import"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/workflows" "$STAGE/keep"
          cp "$ZIP" "$STAGE/upload.zip"

          WF_PATH="${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}"
          WF_PATH="${WF_PATH%%@*}"
          if [ ! -f "$WF_PATH" ]; then
            echo "::error::Cannot find importer workflow: $WF_PATH"
            exit 1
          fi
          printf '%s\n' "$WF_PATH" > "$STAGE/workflow-path.txt"

          if [ "$PAT_AVAILABLE" = "true" ]; then
            cp -p --parents "$WF_PATH" "$STAGE/workflows/"
          else
            mkdir -p "$STAGE/workflows/.github"
            cp -a .github/workflows "$STAGE/workflows/.github/"
          fi

          KEEP_LIST="$STAGE/keep-list.txt"
          printf '%s\n' ".keep-files" > "$KEEP_LIST"
          read -ra ITEMS <<< "$PRESERVE_FILES" || true
          for item in "${ITEMS[@]}"; do
            printf '%s\n' "$item" >> "$KEEP_LIST"
          done

          if [ -f .keep-files ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in
                ''|'#'*) continue ;;
              esac
              printf '%s\n' "$line" >> "$KEEP_LIST"
            done < .keep-files
          fi

          while IFS= read -r p; do
            p="${p#./}"
            p="${p%/}"
            [ -n "$p" ] || continue
            case "$p" in
              /*|..|../*|*/..|*/../*|.git|.git/*)
                echo "::error::Not allowed in keep list: $p"
                exit 1
                ;;
            esac
            if [ -e "$p" ]; then
              rsync -aR -- "$p" "$STAGE/keep/"
              echo "Keeping: $p"
            fi
          done < <(sort -u "$KEEP_LIST")

      - name: Create backup tag
        if: steps.find.outputs.found == 'true' && env.BACKUP_TAG == 'true'
        id: backup
        run: |
          set -euo pipefail

          TAG="backup-before-import-${GITHUB_RUN_ID}"
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          export GIT_INDEX_FILE="$RUNNER_TEMP/backup-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree HEAD

          while IFS= read -r -d '' f; do
            git rm -r -q --cached -- "$f"
            echo "Not in backup: $f"
          done < <(git ls-tree -z --name-only HEAD | grep -zi '\.zip$' || true)

          BACKUP_TREE="$(git write-tree)"
          BACKUP_COMMIT="$(git commit-tree "$BACKUP_TREE" -p HEAD -m "Backup before import $GITHUB_RUN_ID")"
          unset GIT_INDEX_FILE

          git tag "$TAG" "$BACKUP_COMMIT"
          if git push origin "refs/tags/$TAG"; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Backup tag created: $TAG"

            git ls-remote --tags --refs origin 'refs/tags/backup-*' \
              | awk '{print $2}' \
              | sed 's|^refs/tags/||' \
              | awk -F- '{print $NF, $0}' \
              | sort -rn \
              | awk -v keep="$BACKUP_KEEP" 'NR > keep {print $2}' \
              | while read -r OLD; do
                  [ -n "$OLD" ] || continue
                  [ "$OLD" = "$TAG" ] && continue
                  git push origin --delete "refs/tags/$OLD" || echo "::warning::Could not remove $OLD"
                done
          else
            echo "::warning::Could not push backup tag. Continuing without remote backup tag."
          fi

      - name: Clean repository
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

      - name: Extract ZIP
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/zip-import"
          EX="$STAGE/extract"
          mkdir -p "$EX"
          unzip -q "$STAGE/upload.zip" -d "$EX"

          rm -rf "$EX/__MACOSX"
          find "$EX" -name '.DS_Store' -type f -delete
          find "$EX" -name '.git' -prune -exec rm -rf {} +

          EXR="$(realpath "$EX")"
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /*) resolved="$(realpath -m "$target")" ;;
              *) resolved="$(realpath -m "$(dirname "$link")/$target")" ;;
            esac
            case "$resolved" in
              "$EXR"|"$EXR"/*) ;;
              *)
                echo "::error::Unsafe symlink in ZIP: $link -> $target"
                exit 1
                ;;
            esac
          done < <(find "$EX" -type l -print0)

          [ -n "$(ls -A "$EX")" ] || { echo "::error::ZIP has no project files."; exit 1; }

          BIG="$(find "$EX" -type f -size +"${MAX_FILE_MB}"M | head -20)"
          if [ -n "$BIG" ]; then
            echo "::error::Files larger than ${MAX_FILE_MB} MB found:"
            printf '%s\n' "$BIG"
            exit 1
          fi

      - name: Detect project root
        if: steps.find.outputs.found == 'true'
        id: root
        run: |
          set -euo pipefail
          EX="$RUNNER_TEMP/zip-import/extract"
          ROOT="$EX"
          mapfile -t TOP < <(find "$EX" -mindepth 1 -maxdepth 1)

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ] && [ ! -L "${TOP[0]}" ]; then
            if [ "$(basename "${TOP[0]}")" != '.github' ]; then
              ROOT="${TOP[0]}"
            fi
          fi

          echo "Project root: $ROOT"
          printf 'path=%s\n' "$ROOT" >> "$GITHUB_OUTPUT"

      - name: Import project
        if: steps.find.outputs.found == 'true'
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.path }}
        run: |
          set -euo pipefail
          EXCLUDES=(--exclude='/.git')
          if [ "$PAT_AVAILABLE" != "true" ]; then
            EXCLUDES+=(--exclude='/.github/workflows/')
            echo "::warning::GH_PAT is not configured. Workflow files inside the ZIP will not be imported."
          fi
          rsync -a "${EXCLUDES[@]}" "$PROJECT_ROOT/" ./

      - name: Restore importer workflow
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/zip-import"
          cp -a "$STAGE/workflows/.github" ./
          [ -d "$STAGE/keep" ] && cp -a "$STAGE/keep/." ./ || true

          WF_PATH="$(cat "$STAGE/workflow-path.txt")"
          if [ ! -f "$WF_PATH" ]; then
            echo "::error::Importer workflow was not restored: $WF_PATH"
            exit 1
          fi

      - name: Delete uploaded ZIP
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: rm -f -- "$ZIP"

      - name: Commit and push imported project
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
          BACKUP: ${{ steps.backup.outputs.tag }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          STATUS="$(git diff --cached --name-status --no-renames)"
          ADDED="$(printf '%s\n' "$STATUS" | awk -F '\t' '$1=="A"{n++} END{print n+0}')"
          CHANGED="$(printf '%s\n' "$STATUS" | awk -F '\t' '$1=="M"{n++} END{print n+0}')"
          REMOVED="$(printf '%s\n' "$STATUS" | awk -F '\t' '$1=="D" && tolower($2) !~ /^[^\/]*\.zip$/{n++} END{print n+0}')"
          OLD_COUNT="$(git ls-tree -r --name-only HEAD | awk 'tolower($0) !~ /^[^\/]*\.zip$/{n++} END{print n+0}')"
          ZNAME="$(basename "$ZIP")"

          FORCE_IMPORT=false
          case "$ZNAME" in
            *force*.zip|*FORCE*.zip) FORCE_IMPORT=true ;;
          esac

          if [ "$MAX_REMOVED_PERCENT" -gt 0 ] && [ "$OLD_COUNT" -ge 10 ] && [ "$FORCE_IMPORT" != 'true' ]; then
            REMOVED_PERCENT=$((REMOVED * 100 / OLD_COUNT))
            if [ "$REMOVED_PERCENT" -gt "$MAX_REMOVED_PERCENT" ]; then
              echo "::error::Import would remove ${REMOVED_PERCENT}% of existing files (limit ${MAX_REMOVED_PERCENT}%)."
              echo 'Rename the ZIP with "force" to explicitly allow this replacement.'
              exit 1
            fi
          fi

          git commit -m "Import project from ${ZNAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo '### ZIP import completed'
            echo ''
            echo "- Added: $ADDED"
            echo "- Changed: $CHANGED"
            echo "- Removed: $REMOVED"
            echo "- Backup tag: ${BACKUP:-not-created}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger requested workflows
        if: success() && steps.find.outputs.found == 'true' && env.TRIGGER_WORKFLOWS != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          for workflow in $TRIGGER_WORKFLOWS; do
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME"
          done

  maintenance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Restore from backup tag
        if: inputs.action == 'restore'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          TAG="${{ inputs.backup_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git tag --list 'backup-before-import-*' --sort=-v:refname | head -1)"
          fi
          [ -n "$TAG" ] || { echo '::error::No backup tag found.'; exit 1; }

          git fetch --tags origin
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          git checkout "$TAG" -- .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m "Restore backup $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Clean repository
        if: inputs.action == 'clean-repo'
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/maintenance"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          if [ -d .github/workflows ]; then
            cp -a .github/workflows "$STAGE/workflows"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          if [ -d "$STAGE/workflows" ]; then
            mkdir -p .github
            cp -a "$STAGE/workflows" .github/
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Clean repository'
          git push origin "HEAD:${GITHUB_REF_NAME}"
