name: Import Project ZIP

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose an operation"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - clean

permissions:
  contents: write

jobs:
  project-manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Clean repository
        if: ${{ inputs.operation == 'clean' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning repository contents while preserving .git and workflow."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Remove everything in .github except workflows.
          find .github -mindepth 1 -maxdepth 1 \
            ! -name "workflows" \
            -exec rm -rf {} + 2>/dev/null || true

          # Keep only workflow YAML files.
          if [ -d ".github/workflows" ]; then
            find .github/workflows -mindepth 1 -type f \
              ! -name "*.yml" \
              ! -name "*.yaml" \
              -delete
          fi

          echo "Clean complete."
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" | sort

      - name: Find ZIP
        if: ${{ inputs.operation == 'import' }}
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find . -maxdepth 1 -type f -iname "*.zip" -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP file found in repository root."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "ZIP=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Found ZIP: ${ZIPS[0]}"

      - name: Extract ZIP
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/project
          mkdir -p /tmp/project

          unzip -q -o "${{ steps.find_zip.outputs.ZIP }}" -d /tmp/project

          echo "ZIP contents:"
          find /tmp/project -maxdepth 4 -print | sort

      - name: Detect project root
        if: ${{ inputs.operation == 'import' }}
        id: project_root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/project"

          # Direct ZIP root.
          if [ -f "$ROOT/README.md" ] || \
             [ -d "$ROOT/.github" ] || \
             [ -d "$ROOT/assets" ] || \
             [ -d "$ROOT/scripts" ]; then
            echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
            echo "Using ZIP root: $ROOT"
            exit 0
          fi

          # Single wrapper directory, e.g. ZIP -> SudiptoKumar/...
          mapfile -t DIRS < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d)
          mapfile -t FILES < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type f)

          if [ "${#DIRS[@]}" -eq 1 ] && [ "${#FILES[@]}" -eq 0 ]; then
            echo "ROOT=${DIRS[0]}" >> "$GITHUB_OUTPUT"
            echo "Using project directory: ${DIRS[0]}"
            exit 0
          fi

          echo "::error::Could not determine project root."
          echo "Top-level directories:"
          printf '%s\n' "${DIRS[@]}"
          echo "Top-level files:"
          printf '%s\n' "${FILES[@]}"
          exit 1

      - name: Import project files
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="${{ steps.project_root.outputs.ROOT }}"

          # Preserve this manager workflow so the repository can be imported again later.
          mkdir -p /tmp/workflow-backup
          for f in .github/workflows/import-zip.yml .github/workflows/import-zip-fixed.yml; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/workflow-backup/$(basename "$f")"
            fi
          done

          # Remove current repository contents EXCEPT .git.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          # Copy the ZIP project into the repository.
          cp -a "$ROOT"/. ./

          # Restore the import manager workflow if it was not supplied by the ZIP.
          mkdir -p .github/workflows
          for f in /tmp/workflow-backup/import-zip.yml /tmp/workflow-backup/import-zip-fixed.yml; do
            if [ -f "$f" ]; then
              cp "$f" ".github/workflows/$(basename "$f")"
            fi
          done

          echo "Project imported."
          echo "Repository after import:"
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" | sort

      - name: Delete ZIP files
        if: ${{ inputs.operation == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -iname "*.zip" -delete
          echo "ZIP file removed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          # Sanity check: the Git repository MUST still exist.
          test -d .git || {
            echo "::error::Git metadata was removed during the import."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          if [ "${{ inputs.operation }}" = "clean" ]; then
            MESSAGE="Clean repository"
          else
            MESSAGE="Import project from ZIP"
          fi

          git commit -m "$MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Import completed successfully."
