name: Stats update

# Quick reaction. When something happens on this repository
# (a release, a star or a fork) the hero card, stats and map update at once.
on:
  release:
    types: [published]
  watch:
    types: [started]
  fork:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kingdom-write
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update hero, stats and map
        env:
          GH_TOKEN: ${{ secrets.KINGDOM_TOKEN || secrets.GITHUB_TOKEN }}
        run: node engine/cli.mjs update --only=hero,world,events,quest,districts,trophies,status
      - name: Safety check for all pictures
        run: node engine/cli.mjs lint
      - name: Save changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="${DEFAULT_BRANCH:-$GITHUB_REF_NAME}"
          git config user.name "kingdom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data renderer README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "kingdom: quick stats update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          exit 1
      - name: Prune old workflow runs (keep newest 30)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          page=1
          while :; do
            ids=$(gh api "repos/${{ github.repository }}/actions/runs?status=completed&per_page=100&page=$page" --jq '.workflow_runs[].id')
            count=$(echo "$ids" | grep -c .)
            [ "$count" -eq 0 ] && break
            del="$ids"
            if [ "$page" -eq 1 ]; then del=$(echo "$ids" | tail -n +31); fi
            for id in $del; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" --silent || true
            done
            [ "$count" -lt 100 ] && break
            page=$((page+1))
            [ "$page" -gt 20 ] && break
          done
          echo "Run history pruned: newest 30 completed runs kept."
