name: Send a goblin raid
description: Send harmless goblins to the castle. It is only a game.
title: "👹 Goblin Raid Request"
labels: ["raid-request"]
body:
  - type: markdown
    attributes:
      value: |
        The goblins march to the castle and the kingdom defends itself.
        Nothing is harmed. The raid ends by itself at the next update.
        Only one raid can happen at a time, and the goblins need rest between raids.
  - type: dropdown
    id: size
    attributes:
      label: Raid size
      options:
        - Small raid (3 goblins)
        - Medium raid (6 goblins)
        - Large raid (9 goblins)
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: promise
    attributes:
      label: Promise
      options:
        - label: I know this is a game and the raid is harmless.
          required: true
